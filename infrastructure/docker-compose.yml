version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gaphto_db
    environment:
      POSTGRES_USER: gaphto
      POSTGRES_PASSWORD: gaphto_secret
      POSTGRES_DB: gaphto
    ports:
      - "5434:5432"
    volumes:
      - gaphto_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaphto -d gaphto"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: gaphto_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gaphto.org
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: gaphto_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gaphto_minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gaphto_pgdata:
    name: gaphto_pgdata
  gaphto_minio_data:
